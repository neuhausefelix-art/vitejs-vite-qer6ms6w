<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lapbook overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Lapbook overlay. Six styles share the same pieces (head, time, delta, bar,
   sectors, foot); the body class decides how they look and sit. */
:root{--k:1;--op:.86;--team:#ff3030;--tx:#f5f5f7;--mu:#8f8f9b;--dim:#5c5c66;--purple:#b45bff;--green:#2fe07f;--yellow:#ffd12a;--red:#ff4b4b;--rad:14px;--font:'Saira Semi Condensed',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:transparent;overflow:hidden;height:100%;font-family:var(--font);color:var(--tx);user-select:none;font-variant-numeric:tabular-nums}
body.f-mono{--font:'JetBrains Mono',ui-monospace,monospace}body.f-sans{--font:'Inter',system-ui,sans-serif}
body.sharp{--rad:2px}
#o{position:absolute;inset:calc(3px*var(--k));border-radius:calc(var(--rad)*var(--k));background:rgba(12,12,15,var(--op));box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);padding:calc(12px*var(--k)) calc(16px*var(--k));display:flex;flex-direction:column;justify-content:center;gap:calc(8px*var(--k));overflow:hidden}
#o:before{content:"";position:absolute;left:0;top:calc(14px*var(--k));bottom:calc(14px*var(--k));width:calc(3px*var(--k));border-radius:0 3px 3px 0;background:var(--team)}
body.edit #o{-webkit-app-region:drag;cursor:move;box-shadow:inset 0 0 0 2px var(--red)}
.top{display:flex;align-items:baseline;gap:calc(8px*var(--k));font-size:calc(13px*var(--k));color:var(--mu);white-space:nowrap;overflow:hidden}
.top b{color:var(--tx);font-weight:700;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.top span{overflow:hidden;text-overflow:ellipsis;flex:1}
.top em{font-style:normal;color:var(--tx);font-weight:700;font-size:calc(14px*var(--k))}.top em small{color:var(--mu);font-weight:600}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:calc(12px*var(--k))}
.cur{font-size:calc(46px*var(--k));font-weight:800;line-height:.95;letter-spacing:-.01em;white-space:nowrap}
.cur.inv{color:#ff8a7a}
.cur small{font-size:calc(12px*var(--k));font-weight:700;color:var(--mu);margin-left:calc(6px*var(--k));letter-spacing:.06em;text-transform:uppercase}
.dl{font-size:calc(30px*var(--k));font-weight:800;line-height:1;white-space:nowrap}
.dl.up{color:var(--green)}.dl.dn{color:var(--red)}.dl.no{color:var(--dim)}.dl.rec{color:var(--red);font-size:calc(20px*var(--k));letter-spacing:.08em}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(8px*var(--k))}
.sec i{display:block;height:calc(4px*var(--k));border-radius:2px;background:rgba(255,255,255,.1)}
.sec.purple i{background:var(--purple)}.sec.green i{background:var(--green)}.sec.yellow i{background:var(--yellow)}.sec.invalid i{background:#ff8a7a}
.sec b{display:block;font-size:calc(16px*var(--k));font-weight:700;margin-top:calc(4px*var(--k));color:var(--mu)}
.sec.purple b{color:var(--purple)}.sec.green b{color:var(--green)}.sec.yellow b{color:var(--tx)}
.foot{display:flex;justify-content:space-between;gap:calc(12px*var(--k));font-size:calc(15px*var(--k));color:var(--mu);font-weight:600;white-space:nowrap}
.foot b{color:var(--tx);font-weight:700;margin-left:calc(6px*var(--k))}.foot .pb{color:var(--purple)}
.foot em{font-style:normal;font-weight:700;margin-left:calc(5px*var(--k))}.up2{color:var(--green)}.dn2{color:var(--red)}
.idle{font-size:calc(14px*var(--k));color:var(--mu)}.idle b{color:var(--tx)}
.hint{display:none;position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:calc(10px*var(--k));color:#fff;background:var(--red);padding:1px 0;font-family:system-ui,sans-serif}
body.edit .hint{display:block}
.dbar{position:relative;height:calc(6px*var(--k));border-radius:3px;background:rgba(255,255,255,.08)}
.dbar:after{content:"";position:absolute;left:50%;top:calc(-3px*var(--k));bottom:calc(-3px*var(--k));width:2px;margin-left:-1px;background:rgba(255,255,255,.35)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.pos2{font-size:calc(14px*var(--k));font-weight:700;color:var(--tx);align-self:center}.pos2 small{color:var(--mu)}

/* compact: lap time and delta only */
body.compact #o{flex-direction:row;flex-wrap:wrap;align-items:center;align-content:center;justify-content:space-between;padding:calc(8px*var(--k)) calc(16px*var(--k))}
body.compact .cur{font-size:calc(38px*var(--k))}body.compact .dl{font-size:calc(26px*var(--k))}body.compact .dbar{flex-basis:100%}

/* broadcast: TV graphics, a coloured band with the position, square and bold */
body.broadcast{--rad:4px}body.broadcast.sharp{--rad:0px}
body.broadcast #o{padding:0;gap:0;background:rgba(21,21,30,var(--op));box-shadow:0 calc(4px*var(--k)) calc(18px*var(--k)) rgba(0,0,0,.45)}
body.broadcast #o:before{display:none}
body.broadcast .top{background:var(--team);color:#fff;padding:calc(6px*var(--k)) calc(14px*var(--k));font-size:calc(13px*var(--k));align-items:center}
body.broadcast .top b{color:#fff;letter-spacing:.08em}body.broadcast .top span{color:rgba(255,255,255,.8)}
body.broadcast .top em{order:-1;background:#fff;color:#15151e;padding:0 calc(8px*var(--k));border-radius:calc(2px*var(--k));font-size:calc(14px*var(--k))}body.broadcast .top em small{color:#15151e99}
body.broadcast.acc-none .top{background:#2a2a36}
body.broadcast .row{padding:calc(10px*var(--k)) calc(14px*var(--k)) calc(4px*var(--k));align-items:center}
body.broadcast .cur{font-size:calc(44px*var(--k));font-style:italic;letter-spacing:.01em}
body.broadcast .dl{font-size:calc(22px*var(--k));padding:calc(4px*var(--k)) calc(10px*var(--k));border-radius:calc(3px*var(--k));color:#fff;font-style:italic}
body.broadcast .dl.up{background:#14a35a}body.broadcast .dl.dn{background:#d62d2d}body.broadcast .dl.no{background:#2a2a36;color:#9a9aa8}body.broadcast .dl.rec{background:#d62d2d;color:#fff}
body.broadcast .dbar{margin:calc(4px*var(--k)) calc(14px*var(--k))}
body.broadcast .secs{gap:2px;padding:calc(6px*var(--k)) calc(14px*var(--k)) 0}
body.broadcast .sec i{height:calc(6px*var(--k));border-radius:0}
body.broadcast .sec b{font-size:calc(15px*var(--k))}
body.broadcast .foot{padding:calc(6px*var(--k)) calc(14px*var(--k)) calc(10px*var(--k));font-size:calc(14px*var(--k));text-transform:uppercase;letter-spacing:.04em}

/* glass: light, airy panel */
body.glass{--rad:22px}
body.glass #o{background:rgba(190,200,220,calc(var(--op)*.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.35),0 calc(8px*var(--k)) calc(24px*var(--k)) rgba(0,0,0,.25);padding:calc(14px*var(--k)) calc(18px*var(--k))}
body.glass #o:before{left:auto;right:calc(16px*var(--k));top:calc(12px*var(--k));bottom:auto;width:calc(8px*var(--k));height:calc(8px*var(--k));border-radius:50%;box-shadow:0 0 calc(10px*var(--k)) var(--team)}
body.glass .cur,body.glass .dl,body.glass .top b,body.glass .sec b,body.glass .foot{text-shadow:0 1px calc(6px*var(--k)) rgba(0,0,0,.55)}
body.glass .top,body.glass .foot{color:rgba(255,255,255,.75)}body.glass .sec b{color:rgba(255,255,255,.8)}
body.glass .sec i{background:rgba(255,255,255,.22);height:calc(5px*var(--k))}
body.glass .cur{font-weight:700}

/* minimal: no panel, floating numbers */
body.minimal #o{background:none;box-shadow:none;padding:calc(6px*var(--k)) calc(8px*var(--k));gap:calc(4px*var(--k))}
body.minimal #o:before{display:none}
body.minimal.edit #o{box-shadow:inset 0 0 0 2px var(--red)}
body.minimal .cur,body.minimal .dl,body.minimal .top,body.minimal .sec b,body.minimal .foot,body.minimal .pos2{text-shadow:0 0 calc(3px*var(--k)) #000,0 1px calc(8px*var(--k)) rgba(0,0,0,.9)}
body.minimal .cur{font-size:calc(48px*var(--k))}
body.minimal .top{color:rgba(255,255,255,.8)}body.minimal .top b{color:var(--team)}body.minimal.acc-none .top b{color:#fff}
body.minimal .sec i{height:calc(3px*var(--k));box-shadow:0 0 calc(4px*var(--k)) rgba(0,0,0,.8)}
body.minimal .foot{color:rgba(255,255,255,.8)}

/* strip: one thin row, made for the top or bottom edge */
body.strip #o{flex-direction:row;align-items:center;justify-content:flex-start;gap:calc(14px*var(--k));padding:0 calc(16px*var(--k)) 0 calc(18px*var(--k))}
body.strip #o:before{top:0;bottom:0;width:calc(5px*var(--k));border-radius:0}
body.strip .top{flex:0 1 auto;flex-direction:column;align-items:flex-start;gap:0;min-width:0;max-width:calc(150px*var(--k));line-height:1.15}
body.strip .top span{font-size:calc(11px*var(--k));max-width:100%}
body.strip .top em{display:none}
body.strip .row{gap:calc(10px*var(--k));align-items:center}
body.strip .cur{font-size:calc(30px*var(--k))}body.strip .dl{font-size:calc(22px*var(--k))}
body.strip .pos2{font-size:calc(18px*var(--k));padding-right:calc(4px*var(--k));border-right:1px solid rgba(255,255,255,.15);padding-right:calc(12px*var(--k))}
body.strip .secs{display:flex;gap:calc(8px*var(--k))}body.strip .sec{width:calc(66px*var(--k))}body.strip .sec b{font-size:calc(14px*var(--k));margin-top:calc(3px*var(--k))}
body.strip .foot{flex-direction:column;gap:0;font-size:calc(12px*var(--k));line-height:1.3;margin-left:auto}
body.strip .dbar{width:calc(90px*var(--k))}
</style></head><body>
<div id="o"></div>
<script>
const $ = s => document.querySelector(s);
const pad = (n, l = 2) => String(n).padStart(l, "0");
const fmt = ms => ms > 0 ? `${Math.floor(ms / 6e4)}:${pad(Math.floor(ms % 6e4 / 1e3))}.${pad(Math.floor(ms % 1e3), 3)}` : "–:––.–––";
const sfmt = ms => ms > 0 ? (ms >= 6e4 ? fmt(ms) : (ms / 1e3).toFixed(3)) : "–";
const gap = ms => (ms > 0 ? "+" : ms < 0 ? "−" : "±") + (Math.abs(ms) / 1e3).toFixed(3);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TEAM = [[/mclaren/i, "#ff8000"], [/ferrari/i, "#e8002d"], [/red bull racing/i, "#3671c6"], [/mercedes/i, "#27f4d2"], [/aston/i, "#229971"], [/alpine/i, "#0093cc"], [/williams/i, "#64c4ff"], [/racing bulls/i, "#6692ff"], [/haas/i, "#b6babd"], [/sauber/i, "#52e252"], [/audi/i, "#ff2d2d"], [/cadillac/i, "#c9a55c"], [/porsche/i, "#d5001c"], [/bmw/i, "#1c69d4"], [/lamborghini/i, "#ddb321"]];
const LAYOUTS = ["clean", "compact", "broadcast", "glass", "minimal", "strip"];
let d = {}, live = {}, cfg = { locked: true, scale: 1, opacity: 0.86, layout: "clean", corners: "round", font: "saira", show: { head: true, delta: true, sectors: true, foot: true, position: true, deltaBar: false }, accent: "team" };
const ACC = { red: "#ff3030", white: "#f5f5f7", none: "transparent", blue: "#3d8bff", green: "#2fe07f", yellow: "#ffd12a", purple: "#b45bff" };

function draw() {
  const R = document.documentElement.style, B = document.body.classList;
  R.setProperty("--k", cfg.scale || 1);
  R.setProperty("--op", cfg.opacity ?? 0.86);
  const team = TEAM.find(([re]) => re.test(d.car || ""));
  const ac = cfg.accent || "team";
  R.setProperty("--team", ac === "team" ? (team ? team[1] : "#ff3030") : ACC[ac] || ac);
  const sh = cfg.show || {}, layout = LAYOUTS.includes(cfg.layout) ? cfg.layout : "clean";
  LAYOUTS.forEach(l => B.toggle(l, l === layout));
  B.toggle("edit", !cfg.locked);
  B.toggle("sharp", cfg.corners === "sharp");
  B.toggle("f-mono", cfg.font === "mono");
  B.toggle("f-sans", cfg.font === "sans");
  B.toggle("acc-none", ac === "none");
  const o = $("#o"), hint = `<div class="hint">Drag with the mouse or use Ctrl+Shift+arrows · Ctrl+Shift+L to lock</div>`;
  const g = live.game || d.game;
  if (!g) { o.innerHTML = `<div class="idle"><b>Lapbook</b> · waiting for a game</div>${hint}`; return; }
  let cur = live.game ? live.t : 0, approx = false;
  if (!live.game && g === "Assetto Corsa" && live.acAt && Date.now() - live.acAt < 15 * 60e3) { cur = Date.now() - live.acAt; approx = true; }
  const dl = live.game ? live.delta : null, has = dl !== null && dl !== undefined;
  const deltaHtml = !sh.delta && !live.rec ? "" : live.rec ? `<div class="dl rec">${live.rec === "drag" ? "READY" : "● REC"}</div>` : `<div class="dl ${has ? (dl < 0 ? "up" : "dn") : "no"}">${has ? gap(dl) : "±0.000"}</div>`;
  const w = has ? Math.min(50, Math.abs(dl) / 1000 * 50) : 0; // full half-bar = 1 s
  const barHtml = sh.delta && sh.deltaBar && !live.rec ? `<div class="dbar">${has ? `<i style="${dl < 0 ? `right:50%;background:var(--green)` : `left:50%;background:var(--red)`};width:${w.toFixed(1)}%"></i>` : ""}</div>` : "";
  const posHtml = sh.position && live.position ? `P${live.position}${live.cars ? `<small>/${live.cars}</small>` : ""}` : "";
  const timeHtml = `<div class="cur ${live.invalid ? "inv" : ""}">${fmt(cur)}${approx && cur ? "<small>approx.</small>" : ""}${live.invalid ? "<small>invalid</small>" : ""}</div>`;
  if (layout === "compact") { o.innerHTML = timeHtml + deltaHtml + barHtml + hint; return; }
  const lastGap = d.last && d.prevBest ? d.last - d.prevBest : null;
  const secs = Array.isArray(live.sectors) ? live.sectors : null;
  const headHtml = sh.head ? `<div class="top"><b>${esc(live.trial || d.track || g)}</b><span>${esc(d.car || "")}</span>${posHtml && layout !== "strip" ? `<em>${posHtml}</em>` : ""}</div>` : "";
  const secHtml = secs && sh.sectors ? `<div class="secs">${secs.map(s => `<div class="sec ${s.t ? s.c || "" : ""}"><i></i><b>${sfmt(s.t)}</b></div>`).join("")}</div>` : "";
  const footHtml = sh.foot ? `<div class="foot"><span>Best<b class="pb">${fmt(d.best)}</b></span><span>Last<b>${fmt(d.last)}</b>${lastGap === null ? "" : `<em class="${lastGap < 0 ? "up2" : "dn2"}">${gap(lastGap)}</em>`}</span></div>` : "";
  if (layout === "strip") {
    o.innerHTML = `${posHtml ? `<span class="pos2">${posHtml}</span>` : ""}${headHtml}<div class="row">${timeHtml}${deltaHtml}</div>${barHtml}${secHtml}${footHtml}${hint}`;
    return;
  }
  const posInRow = (!sh.head || layout === "minimal") && posHtml;
  o.innerHTML = `${headHtml}<div class="row">${timeHtml}${posInRow && !sh.head ? `<span class="pos2">${posHtml}</span>` : ""}${deltaHtml}</div>${barHtml}${secHtml}${footHtml}${hint}`;
}
if (window.overlay) {
  window.overlay.onData(x => { d = x || {}; draw(); });
  window.overlay.onLive(x => { live = x || {}; draw(); });
  window.overlay.onConfig(x => { cfg = { ...cfg, ...x }; draw(); });
} else {
  // preview inside Lapbook's overlay settings: the page sends example data
  window.addEventListener("message", e => {
    if (e.source !== window.parent) return;
    const m = e.data || {};
    if (m.cfg) cfg = { ...cfg, ...m.cfg, locked: true };
    if (m.d) d = m.d;
    if (m.live) live = m.live;
    draw();
  });
}
draw();
</script></body></html>

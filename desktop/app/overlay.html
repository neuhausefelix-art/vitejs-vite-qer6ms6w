<style>
/* Lapbook overlay. Six styles share the same pieces (head, time, delta, bar,

:root{--k:1;--tz:1;--ts:1;--wf:1;--W:374;--in:3px;--bgc:12,12,15;--kt:calc(var(--k)*var(--tz));--ks:calc(var(--k)*var(--ts));--up:#2fe07f;--dn:#ff4b4b;--sg:#2fe07f;--bd:rgba(255,255,255,.28);--op:.86;--team:#ff3030;--tx:#f5f5f7;--mu:#8f8f9b;--dim:#5c5c66;--purple:#b45bff;--green:#2fe07f;--yellow:#ffd12a;--red:#ff4b4b;--rad:14px;--font:'Saira Semi Condensed',system-ui,sans-serif}

<div id="o"></div>
<script>
const $ = s => document.querySelector(s);
const pad = (n, l = 2) => String(n).padStart(l, "0");
let DEC = 3;
const frac = ms => String(Math.floor(ms % 1e3)).padStart(3, "0").slice(0, DEC);
const fmt = ms => ms > 0 ? `${Math.floor(ms / 6e4)}:${pad(Math.floor(ms % 6e4 / 1e3))}.${frac(ms)}` : "–:––." + "–––".slice(0, DEC);
const sfmt = ms => ms > 0 ? (ms >= 6e4 ? fmt(ms) : `${Math.floor(ms / 1e3)}.${frac(ms)}`) : "–";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TEAM = [[/mclaren/i, "#ff8000"], [/ferrari/i, "#e8002d"], [/red bull racing/i, "#3671c6"], [/mercedes/i, "#27f4d2"], [/aston/i, "#229971"], [/alpine/i, "#0093cc"], [/williams/i, "#64c4ff"], [/racing bulls/i, "#6692ff"], [/haas/i, "#b6babd"], [/sauber/i, "#52e252"], [/audi/i, "#ff2d2d"], [/cadillac/i, "#c9a55c"], [/porsche/i, "#d5001c"], [/bmw/i, "#1c69d4"], [/lamborghini/i, "#ddb321"]];
let LANG = "de";
try { LANG = localStorage.getItem("lapbook.lang") || "de"; } catch (e) {}
const T = LANG === "de" ? { Predicted: "Prognose", Lap: "Runde", Session: "Session", Record: "Rekord", Clock: "Uhr", Best: "Beste", Last: "Letzte", "approx.": "ca.", invalid: "ungültig", READY: "BEREIT", "● REC": "● AUFN.", waiting: "wartet auf ein Spiel", hint: "Mit der Maus ziehen oder Strg+Umschalt+Pfeile · Strg+Umschalt+L sperrt" } : { waiting: "waiting for a game", hint: "Drag with the mouse or use Ctrl+Shift+arrows · Ctrl+Shift+L to lock" };
const t = k => T[k] || k;
const LAYOUTS = ["clean", "compact", "broadcast", "glass", "minimal", "strip", "tower", "neon", "carbon", "retro", "pill", "dash"];
const LOOK = { bg: "", fg: "", up: "", dn: "", pu: "", sg: "", ye: "", bd: "", textScale: 1, timeScale: 1, width: "normal", shadow: "off", frame: "off", glow: false, flashPb: true, flashSector: false, tint: "num", autoHide: 0, fade: true, decimals: 3, order: ["head", "main", "bar", "sectors", "extra", "foot"] };

let d = {}, live = {}, cfg = { locked: true, scale: 1, opacity: 0.86, layout: "clean", corners: "round", font: "saira", show: { head: true, delta: true, sectors: true, foot: true, position: true, deltaBar: false }, accent: "team" };
const ACC = { red: "#ff3030", white: "#f5f5f7", none: "transparent", blue: "#3d8bff", green: "#2fe07f", yellow: "#ffd12a", purple: "#b45bff" };


const rgb = h => /^#[0-9a-f]{6}$/i.test(h || "") ? [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(",") : "";
let lastLiveAt = Date.now(), seenLast, seenPurple = [];
function draw() {
  const R = document.documentElement.style, B = document.body.classList, L = { ...LOOK, ...(cfg.look || {}) }, k = cfg.scale || 1;
  DEC = [1, 2, 3].includes(L.decimals) ? L.decimals : 3;
  R.setProperty("--k", k);
  R.setProperty("--op", cfg.opacity ?? 0.86);
  R.setProperty("--tz", L.timeScale || 1);
  R.setProperty("--ts", L.textScale || 1);
  R.setProperty("--wf", { narrow: 0.85, wide: 1.2 }[L.width] || 1);
  R.setProperty("--in", ({ soft: 9, strong: 16 }[L.shadow] || 3) * k + "px");
  const team = TEAM.find(([re]) => re.test(d.car || ""));

name: Lapbook Windows build

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/lapbook-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Lapbook-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error
